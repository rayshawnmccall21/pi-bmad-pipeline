name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline repository
        uses: actions/checkout@v4

      - name: Check out pinned pi-bmad sibling
        uses: actions/checkout@v4
        with:
          repository: rayshawnmccall21/pi-bmad
          ref: 0e98488146a9f569a4f411c4b306b021a80edfb9
          path: pi-bmad
          # pi-bmad is a private repo, so GITHUB_TOKEN (scoped to this repo)
          # cannot reach it. Create a fine-grained PAT with read access to
          # rayshawnmccall21/pi-bmad and store it as PI_BMAD_READ_TOKEN.
          token: ${{ secrets.PI_BMAD_READ_TOKEN }}

      - name: "Place pi-bmad at the file: dependency location"
        run: mv "$GITHUB_WORKSPACE/pi-bmad" "$GITHUB_WORKSPACE/../pi-bmad"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Run the full quality gate
        run: npm run check
