name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline repository
        uses: actions/checkout@v4

      - name: Check out pi-bmad sibling (main)
        uses: actions/checkout@v4
        with:
          repository: rayshawnmccall21/pi-bmad
          # Float to main so CI always tests against the latest pi-bmad; the
          # strict quality gate surfaces any breaking change as red CI.
          ref: main
          path: pi-bmad
          # pi-bmad is a private repo, so GITHUB_TOKEN (scoped to this repo)
          # cannot reach it. PI_BMAD_READ_TOKEN is a PAT with repo scope.
          token: ${{ secrets.PI_BMAD_READ_TOKEN }}

      - name: "Place pi-bmad at the file: dependency location"
        run: mv "$GITHUB_WORKSPACE/pi-bmad" "$GITHUB_WORKSPACE/../pi-bmad"

      - name: Install pi-bmad dependency tree
        run: cd "$GITHUB_WORKSPACE/../pi-bmad" && npm ci

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"

      - name: Run the full quality gate
        run: npm run check
