id: create-story-dev-story-code-review-docs
description: >
  Reusable implementation pipeline for pure library/mechanism stories with no UI
  or E2E surface: create-story -> dev-story -> code-review (only Critical
  findings regress; lower severities remain visible and nonblocking) -> docs.
  Drops e2e-plan and e2e-verify; npm run
  check is the deterministic gate inside dev-story. The rundef id uses hyphens
  because the identifier schema forbids underscores. Each agent stage loads the
  project quality guard plus pi-observability, pi-subagents, and pi-mcp-adapter
  so children retain locked-file protection and the tools the BMAD workflows
  declare (the supervisor otherwise runs --no-extensions). Observability pool
  is a constant project label; per-story
  pooling needs supervisor ${storyId} interpolation (not yet implemented).
  Every agent stage also loads the packaged BMAD experts extension so the
  bmad_query_experts research team is available mid-stage; the extension
  appends its bounded roster note without replacing the workflow persona.
stages:
  - id: create-story
    kind: agent
    workflow: create-story
    agent: sm
    timeout: 1800
    oPool: pi-bmad-pipeline
    oName: sm
    oTag: create-story
    extensions:
      - .pi/extensions/quality-guard.ts
      - ~/.pi/agent/extensions/pi-observability/index.ts
      - npm:pi-subagents
      - npm:pi-mcp-adapter
      - .pi/extensions/experts.ts

  - id: dev-story
    kind: agent
    workflow: dev-story
    agent: dev
    timeout: 7200
    oPool: pi-bmad-pipeline
    oName: dev
    oTag: dev-story
    extensions:
      - .pi/extensions/quality-guard.ts
      - ~/.pi/agent/extensions/pi-observability/index.ts
      - npm:pi-subagents
      - npm:pi-mcp-adapter
      - .pi/extensions/experts.ts

  - id: code-review
    kind: agent
    workflow: code-review
    agent: dev
    gate: code-review-critical-only
    onFail: dev-story
    thinking: high
    timeout: 2400
    oPool: pi-bmad-pipeline
    oName: dev
    oTag: code-review
    extensions:
      - .pi/extensions/quality-guard.ts
      - ~/.pi/agent/extensions/pi-observability/index.ts
      - npm:pi-subagents
      - npm:pi-mcp-adapter
      - .pi/extensions/experts.ts

  - id: docs
    kind: agent
    workflow: docs
    agent: architect
    thinking: high
    timeout: 1800
    oPool: pi-bmad-pipeline
    oName: architect
    oTag: docs
    extensions:
      - .pi/extensions/quality-guard.ts
      - ~/.pi/agent/extensions/pi-observability/index.ts
      - npm:pi-subagents
      - npm:pi-mcp-adapter
      - .pi/extensions/experts.ts
