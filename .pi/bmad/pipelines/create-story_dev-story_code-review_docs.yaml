id: create-story-dev-story-code-review-docs
description: >
  STY-112 (code-stage-type) implementation pipeline. create-story → dev-story →
  code-review (regresses to dev-story on gate failure) → docs. Drops the e2e-plan
  and e2e-verify stages because this is a pure library/mechanism change with no
  UI or E2E surface; npm run check is the deterministic gate inside dev-story.
  File named for its stages; the rundef id uses hyphens because the identifier
  schema forbids underscores.
stages:
  - id: create-story
    kind: agent
    workflow: create-story
    agent: sm
    timeout: 1800
    oPool: STY-112
    oName: sm
    oTag: create-story
    extensions:
      - /Users/Apple/.pi/agent/extensions/pi-observability/upstream/extension/pi-observability.ts

  - id: dev-story
    kind: agent
    workflow: dev-story
    agent: dev
    timeout: 7200
    oPool: STY-112
    oName: dev
    oTag: dev-story
    extensions:
      - /Users/Apple/.pi/agent/extensions/pi-observability/upstream/extension/pi-observability.ts

  - id: code-review
    kind: agent
    workflow: code-review
    agent: dev
    gate: code-review
    onFail: dev-story
    thinking: high
    timeout: 2400
    oPool: STY-112
    oName: dev
    oTag: code-review
    extensions:
      - /Users/Apple/.pi/agent/extensions/pi-observability/upstream/extension/pi-observability.ts

  - id: docs
    kind: agent
    workflow: docs
    agent: architect
    thinking: high
    timeout: 1800
    oPool: STY-112
    oName: architect
    oTag: docs
    extensions:
      - /Users/Apple/.pi/agent/extensions/pi-observability/upstream/extension/pi-observability.ts
